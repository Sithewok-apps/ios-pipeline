# Signs the newest builds of the owner's games with the sideloading kit and
# replaces their Install buttons on the install page (install-links.yml). Game
# links stay until the next update (the 30-day cleanup skips them). Each game
# comes from its repo's ios-latest release, or from a test build: the ID of a
# manual run on an exp/ branch, which keeps its IPAs as run artifacts. Games
# without releases (DOOM 3, Dark Forces) come from their newest successful
# build on the ios branch, or the run ID given. Shadows of the Empire comes
# from the newest successful build on main of the private sote-ios repo,
# which needs the SOTE_REPO_TOKEN secret (a fine-grained token with Actions:
# Read on sithewok13-dev/sote-ios). POSTAL and NOLF2 come from their repos'
# ios-latest release.
# "Auto: Jedi Knight builds" (auto-openjkdf2.yml) starts it for openjkdf2 and
# openmots only, when the game repo has a new build.
name: Update game links
run-name: Update game links (${{ inputs.games || 'openjkdf2 openmots sam-fe sam-se' }})

on:
  workflow_dispatch:
    inputs:
      openjkdf2_run:
        description: OpenJKDF2 test build run ID (leave empty for ios-latest)
        required: false
        default: ""
      serioussam_run:
        description: Serious Sam test build run ID (leave empty for ios-latest)
        required: false
        default: ""
      other_run:
        description: Half-Life, DOOM 3, Dark Forces, SotE, POSTAL or NOLF2 build run ID, when signing just that one (leave empty for the newest)
        required: false
        default: ""
      games:
        description: Which games to sign, separated by spaces (also half-life, doom3, darkforces, sote, postal, nolf2)
        required: false
        default: openjkdf2 openmots sam-fe sam-se

permissions:
  contents: write  # the install releases
  actions: write   # rebuild the install page

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      CERTS_REPO_URL: ${{ secrets.CERTS_REPO_URL }}
      CERTS_REPO_USER: ${{ secrets.CERTS_REPO_USER }}
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      WORK: ${{ github.workspace }}/games
      GAMES: ${{ inputs.games || 'openjkdf2 openmots sam-fe sam-se' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: pipeline
          sparse-checkout: .github/scripts

      - name: Download the games
        env:
          JK_RUN: ${{ inputs.openjkdf2_run }}
          SAM_RUN: ${{ inputs.serioussam_run }}
          OTHER_RUN: ${{ inputs.other_run }}
          SOTE_REPO_TOKEN: ${{ secrets.SOTE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          for g in $GAMES; do
            case "$g" in openjkdf2|openmots|sam-fe|sam-se|half-life|doom3|darkforces|sote|postal|nolf2) ;; *) echo "::error::Unknown game: $g"; exit 1;; esac
          done
          mkdir -p "$WORK"
          # slug, repo, run, release asset, artifact name[, workflow: no release,
          # the newest successful run of it on the ios branch]
          fetch() {
            local slug=$1 repo=$2 run=$3 asset=$4 artifact=$5 workflow=${6:-}
            case " $GAMES " in *" $slug "*) ;; *) echo "$slug: not asked for"; return 0;; esac
            mkdir -p "$WORK/dl-$slug"
            if [ -z "$run" ] && [ -n "$workflow" ]; then
              run=$(gh run list --repo "$repo" --workflow "$workflow" --branch ios --status success \
                --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              if [ -z "$run" ]; then
                echo "::error::$slug: no successful $workflow build on the ios branch of $repo"
                exit 1
              fi
            fi
            if [ -n "$run" ]; then
              gh run download "$run" --repo "$repo" --name "$artifact" --dir "$WORK/dl-$slug"
            else
              gh release download ios-latest --repo "$repo" --pattern "$asset" --dir "$WORK/dl-$slug"
            fi
            mv "$WORK/dl-$slug/$asset" "$WORK/$slug.ipa"
            echo "$slug: $(du -h "$WORK/$slug.ipa" | cut -f1) from ${run:+test build }${run:-ios-latest}"
          }
          fetch openjkdf2 sithewok13-dev/OpenJKDF2-iOS "$JK_RUN" OpenJKDF2-iOS-unsigned.ipa OpenJKDF2-iOS-unsigned-ipa
          fetch openmots sithewok13-dev/OpenJKDF2-iOS "$JK_RUN" OpenJKDF2-MotS-iOS-unsigned.ipa OpenJKDF2-MotS-iOS-unsigned-ipa
          fetch sam-fe sithewok13-dev/SeriousSamClassic "$SAM_RUN" serioussam-ios.ipa serioussam-ios
          fetch sam-se sithewok13-dev/SeriousSamClassic "$SAM_RUN" serioussamse-ios.ipa serioussamse-ios
          fetch half-life sithewok13-dev/xash3d-fwgs "$OTHER_RUN" Xash3D-iOS-unsigned.ipa Xash3D-iOS-unsigned-ipa
          fetch doom3 sithewok13-dev/doom3-ios "$OTHER_RUN" DOOM3-iOS-unsigned.ipa DOOM3-iOS-unsigned.ipa ios.yml
          fetch darkforces sithewok13-dev/TheForceEngine "$OTHER_RUN" DarkForces-iOS-unsigned.ipa DarkForces-iOS-unsigned.ipa ios.yml
          fetch postal sithewok13-dev/POSTAL-SourceCode "$OTHER_RUN" postal-ios.ipa postal-ios
          fetch nolf2 sithewok13-dev/nolf2 "$OTHER_RUN" NOLF2-ios.ipa NOLF2-ios-ipa
          # Shadows of the Empire: a private repo, and an artifact named after
          # the version (SotE-iOS-<version>.ipa) from the newest successful
          # build on main.
          case " $GAMES " in
            *" sote "*)
              # Pasted on a phone, a token can pick up spaces or a line break.
              SOTE_REPO_TOKEN=$(printf %s "$SOTE_REPO_TOKEN" | tr -d '[:space:]')
              if [ -z "$SOTE_REPO_TOKEN" ]; then
                echo "::error::sote: add the SOTE_REPO_TOKEN secret (fine-grained token, Actions: Read on sithewok13-dev/sote-ios)"
                exit 1
              fi
              run=$OTHER_RUN
              if [ -z "$run" ]; then
                run=$(GH_TOKEN=$SOTE_REPO_TOKEN gh run list --repo sithewok13-dev/sote-ios --workflow ios.yml \
                  --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
              fi
              if [ -z "$run" ]; then
                echo "::error::sote: no successful ios.yml build on main of sithewok13-dev/sote-ios"
                exit 1
              fi
              mkdir -p "$WORK/dl-sote"
              GH_TOKEN=$SOTE_REPO_TOKEN gh run download "$run" --repo sithewok13-dev/sote-ios \
                --pattern 'SotE-iOS-*.ipa' --dir "$WORK/dl-sote"
              ipa=$(find "$WORK/dl-sote" -name 'SotE-iOS-*.ipa' -type f | head -1)
              if [ -z "$ipa" ]; then
                echo "::error::sote: build $run has no SotE-iOS-*.ipa artifact"
                exit 1
              fi
              mv "$ipa" "$WORK/sote.ipa"
              echo "sote: $(du -h "$WORK/sote.ipa" | cut -f1) from build $run ($(basename "$ipa"))"
              ;;
            *) echo "sote: not asked for" ;;
          esac

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Sign them with the sideloading kit
        run: |
          mkdir -p "$WORK/fastlane"
          cat > "$WORK/fastlane/Fastfile" <<'EOF'
          %w[APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT CERTS_REPO_URL
             CERTS_REPO_USER CERTS_REPO_TOKEN MATCH_PASSWORD].each { |k| ENV[k] = ENV[k].to_s.strip }

          lane :sign do
            setup_ci
            key = app_store_connect_api_key(
              key_id: ENV["ASC_KEY_ID"],
              issuer_id: ENV["ASC_ISSUER_ID"],
              key_content: ENV["ASC_KEY_CONTENT"]
            )
            match(
              type: "adhoc",
              app_identifier: "*",
              team_id: ENV["APPLE_TEAM_ID"],
              api_key: key,
              git_url: ENV["CERTS_REPO_URL"],
              git_basic_authorization: ["#{ENV['CERTS_REPO_USER']}:#{ENV['CERTS_REPO_TOKEN']}"].pack("m0"),
              readonly: true
            )
            ENV["GAMES"].split.each do |slug|
              sh(File.join(ENV["GITHUB_WORKSPACE"], "pipeline/.github/scripts/sign-ipa.sh"),
                 File.join(ENV["WORK"], "#{slug}.ipa"),
                 ENV["sigh_*_adhoc_certificate-name"],
                 ENV["sigh_*_adhoc_profile-path"],
                 File.expand_path("~/Library/Keychains/fastlane_tmp_keychain-db"))
              UI.message("Signed #{slug}")
            end
          end
          EOF
          cd "$WORK"
          status=0
          fastlane sign > sign.log 2>&1 || status=$?
          grep -E "Signed (openjkdf2|openmots|sam-|half-life|doom3|darkforces|sote|postal|nolf2)" sign.log || true
          if [ "$status" != 0 ]; then grep -E "\[!\]|rror" sign.log | tail -8; exit "$status"; fi

      - name: Replace the game links
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%d%H%M)
          for slug in $GAMES; do
            # the previous links for this game
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
              --jq ".[] | select(.tagName | startswith(\"install-game-$slug-\")) | .tagName" |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
            gh release create "install-game-$slug-$STAMP" "$WORK/$slug.ipa" --repo "$GITHUB_REPOSITORY" \
              --title "$slug (signed $(date -u +%Y-%m-%d))" --notes "Game build signed with the sideloading kit. Install page: https://sithewok-apps.github.io/ios-pipeline/"
            echo "Updated $slug"
          done
          gh workflow run install-links.yml --repo "$GITHUB_REPOSITORY" --ref main

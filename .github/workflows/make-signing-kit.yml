# Makes a sideloading kit for a signing app on the phone (Feather, ESign...):
# Sideload.p12 (the account's Apple Distribution certificate and key, with the
# MATCH_PASSWORD passphrase) and Sideload.mobileprovision (an Ad Hoc profile
# for any bundle ID, on every registered device, valid for a year). Both go in
# the private ios-certificates repo, folder "sideload", never in this public
# repo or its logs. Run it by hand after registering a device. It also runs by
# itself once a month and renews the kit when the profile has less than 45 days
# left, then opens an issue here (GitHub emails it) saying the new kit is ready.
name: Make signing kit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 14 3 * *"   # the 3rd of each month

permissions:
  actions: write   # keep the monthly schedule switched on
  issues: write    # the "kit renewed" notice

jobs:
  kit:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      CERTS_REPO_URL: ${{ secrets.CERTS_REPO_URL }}
      CERTS_REPO_USER: ${{ secrets.CERTS_REPO_USER }}
      CERTS_REPO_TOKEN: ${{ secrets.CERTS_REPO_TOKEN }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      # GitHub turns off a public repo's schedules after 60 days without
      # activity; switching it on again here keeps the monthly check alive.
      - name: Keep the monthly check on
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable make-signing-kit.yml --repo "$GITHUB_REPOSITORY" || true

      - name: Renew now?
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "RENEW=1" >> "$GITHUB_ENV"
            exit 0
          fi
          AUTH=$(printf '%s:%s' "$(echo "$CERTS_REPO_USER" | tr -d ' \r\n')" "$(echo "$CERTS_REPO_TOKEN" | tr -d ' \r\n')" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          git -c http.extraheader="Authorization: Basic $AUTH" clone -q --depth 1 "$(echo "$CERTS_REPO_URL" | tr -d ' \r\n')" "$RUNNER_TEMP/check"
          PROF="$RUNNER_TEMP/check/sideload/Sideload.mobileprovision"
          if [ ! -f "$PROF" ]; then
            echo "No kit made yet; nothing to renew."
            echo "RENEW=0" >> "$GITHUB_ENV"
            exit 0
          fi
          EXP=$(security cms -D -i "$PROF" | plutil -extract ExpirationDate raw -o - -)
          LEFT=$(( ( $(date -j -u -f "%Y-%m-%dT%H:%M:%SZ" "$EXP" +%s) - $(date -u +%s) ) / 86400 ))
          echo "The kit's profile expires $EXP ($LEFT days left)"
          if [ "$LEFT" -lt 45 ]; then echo "RENEW=1" >> "$GITHUB_ENV"; else echo "RENEW=0" >> "$GITHUB_ENV"; fi

      - uses: ruby/setup-ruby@v1
        if: env.RENEW == '1'
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        if: env.RENEW == '1'
        run: gem install fastlane --no-document

      - name: Certificate and wildcard Ad Hoc profile
        if: env.RENEW == '1'
        run: |
          mkdir -p "$RUNNER_TEMP/kit/fastlane"
          cat > "$RUNNER_TEMP/kit/fastlane/Fastfile" <<'EOF'
          %w[APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT CERTS_REPO_URL
             CERTS_REPO_USER CERTS_REPO_TOKEN MATCH_PASSWORD].each { |k| ENV[k] = ENV[k].to_s.strip }

          lane :kit do
            setup_ci
            team = ENV["APPLE_TEAM_ID"]
            key = app_store_connect_api_key(
              key_id: ENV["ASC_KEY_ID"],
              issuer_id: ENV["ASC_ISSUER_ID"],
              key_content: ENV["ASC_KEY_CONTENT"]
            )
            devices = Spaceship::ConnectAPI::Device.all.select { |d| d.enabled? && d.platform == "IOS" }
            UI.user_error!("No devices registered yet. Run Register device first.") if devices.empty?

            # One App ID that covers every app
            unless Spaceship::ConnectAPI::BundleId.find("*")
              Spaceship::ConnectAPI::BundleId.create(name: "Sideload Wildcard", platform: "IOS", identifier: "*", seed_id: team)
              UI.message("Made the wildcard App ID")
            end

            match(
              type: "adhoc",
              app_identifier: "*",
              team_id: team,
              api_key: key,
              git_url: ENV["CERTS_REPO_URL"],
              git_basic_authorization: ["#{ENV['CERTS_REPO_USER']}:#{ENV['CERTS_REPO_TOKEN']}"].pack("m0"),
              readonly: false,
              force_for_new_devices: true
            )
            File.open(ENV["GITHUB_ENV"], "a") do |f|
              f.puts("PROFILE_PATH=#{ENV['sigh_*_adhoc_profile-path']}")
              f.puts("KEYCHAIN_PATH=#{File.expand_path('~/Library/Keychains/fastlane_tmp_keychain-db')}")
            end
            puts "STATUS Ad Hoc profile for any app on #{devices.size} device(s)"
          end
          EOF
          cd "$RUNNER_TEMP/kit"
          status=0
          fastlane kit > kit.log 2>&1 || status=$?
          grep STATUS kit.log || true
          if [ "$status" != 0 ]; then grep -E "\[!\]" kit.log | tail -5; exit "$status"; fi

      - name: Save the kit in ios-certificates
        if: env.RENEW == '1'
        run: |
          set -euo pipefail
          # Secrets pasted on a phone can carry a stray space or line break
          for v in CERTS_REPO_URL CERTS_REPO_USER CERTS_REPO_TOKEN MATCH_PASSWORD; do
            printf -v "$v" '%s' "$(printf '%s' "${!v}" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          done
          OUT="$RUNNER_TEMP/kitfiles"
          mkdir -p "$OUT"
          security export -k "$KEYCHAIN_PATH" -t identities -f pkcs12 -P "$MATCH_PASSWORD" -o "$OUT/raw.p12"
          # Re-packed in the classic format (3DES, SHA-1 MAC) that every signing
          # app reads; Feather reports the newer format as a bad password
          export MATCH_PASSWORD
          /usr/bin/openssl pkcs12 -in "$OUT/raw.p12" -passin env:MATCH_PASSWORD -nodes -out "$OUT/key.pem"
          /usr/bin/openssl pkcs12 -export -in "$OUT/key.pem" -out "$OUT/Sideload.p12" -passout env:MATCH_PASSWORD \
            -name "Sideload" -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
          rm -P "$OUT/key.pem" "$OUT/raw.p12" 2>/dev/null || rm -f "$OUT/key.pem" "$OUT/raw.p12"
          /usr/bin/openssl pkcs12 -in "$OUT/Sideload.p12" -passin env:MATCH_PASSWORD -noout && echo "Checked: the .p12 opens with the Match passphrase"
          cp "$PROFILE_PATH" "$OUT/Sideload.mobileprovision"
          EXPIRES=$(security cms -D -i "$OUT/Sideload.mobileprovision" | plutil -extract ExpirationDate raw -o - -)

          AUTH=$(printf '%s:%s' "$CERTS_REPO_USER" "$CERTS_REPO_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          git -c http.extraheader="Authorization: Basic $AUTH" clone -q --depth 1 "$CERTS_REPO_URL" "$RUNNER_TEMP/certs"
          cd "$RUNNER_TEMP/certs"
          mkdir -p sideload
          cp "$OUT/Sideload.p12" "$OUT/Sideload.mobileprovision" sideload/
          printf 'Sideload kit for Feather or ESign.\n\nSideload.p12: certificate; its password is your Match passphrase.\nSideload.mobileprovision: any app, on every registered device. Expires %s.\n' "$EXPIRES" > sideload/README.txt
          git config user.name "ios-pipeline"
          git config user.email "ios-pipeline@users.noreply.github.com"
          git add sideload
          if git diff --cached --quiet; then
            echo "The kit in ios-certificates is already up to date"
          else
            git commit -q -m "Sideload kit (expires $EXPIRES)"
            git -c http.extraheader="Authorization: Basic $AUTH" push -q origin HEAD
            echo "Saved the kit in ios-certificates/sideload (expires $EXPIRES)"
          fi
          echo "KIT_EXPIRES=$EXPIRES" >> "$GITHUB_ENV"

      - name: Tell the owner
        if: env.RENEW == '1' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "New signing kit ready (expires ${KIT_EXPIRES%%T*})" --body "The sideloading kit was renewed automatically.

          1. In Safari, open github.com/Sithewok-apps/ios-certificates, folder **sideload**, and download Sideload.p12 and Sideload.mobileprovision.
          2. Import both into Feather (the .p12 password is your Match passphrase).
          3. Re-sign your apps in Feather and install them again.

          Close this issue when done."
